# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_book'
      - name: Cancel stale Pages deployment
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const response = await github.request("GET /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}", {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pages_deployment_id: context.sha,
              });

              if (response.data.status !== "deployment_in_progress") {
                core.info(`Pages deployment for ${context.sha} is ${response.data.status}; no cancellation needed`);
                return;
              }

              await github.request("POST /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}/cancel", {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pages_deployment_id: context.sha,
              });
              core.info(`Cancelled existing Pages deployment for ${context.sha}`);
            } catch (error) {
              if (error.status === 404) {
                core.info(`No existing Pages deployment found for ${context.sha}`);
                return;
              }
              throw error;
            }
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5